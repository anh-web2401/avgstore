<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVG Store - Thời Trang Nữ Pastel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#F5EBE6] text-gray-700 font-sans antialiased min-h-screen flex flex-col">

    <div id="header-container"></div>

    <main class="flex-grow">
        <div id="loading" class="hidden fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50">
            <div class="spinner"></div>
        </div>

        <div id="app-content">
            <!-- Content will be loaded dynamically -->
        </div>
    </main>

    <div id="footer-container"></div>

    <div id="cart-modal" class="modal">
        <div class="modal-content p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-gray-800">Giỏ Hàng 🛒</h2>
                <button onclick="closeCart()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
            </div>
            <div id="cart-items" class="space-y-3 max-h-96 overflow-y-auto"></div>
            <div class="border-t pt-4 mt-4">
                <div class="flex justify-between items-center mb-4">
                    <span class="font-bold">Tổng cộng:</span>
                    <span id="cart-total" class="text-2xl font-bold text-[#C3AED6]">0đ</span>
                </div>
                <button onclick="checkout()" class="w-full bg-[#C3AED6] text-white py-3 rounded-xl font-bold hover:bg-[#b09bc4] transition-colors">
                    Thanh Toán
                </button>
            </div>
        </div>
    </div>

    <script src="data/database.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/products.js"></script>
    <script src="js/admin.js"></script>
    <script src="components/header-footer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
